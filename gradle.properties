# ── APP 专用零 PoW 通道密钥（与后端 ALTCHA_APP_SECRET 一致，openssl rand -hex 32）──
# 严禁写入本文件提交：本文件已入库，写入等于把生产密钥公开。
# 构建时用下列任一方式注入（见 app/build.gradle.kts 的 altchaAppSecret 读取逻辑）：
#   1) 环境变量：set ALTCHA_APP_SECRET=<hex64>  （CI 用 secrets.ALTCHA_APP_SECRET，见 .github/workflows/android-release.yml）
#   2) 命令行参数：./gradlew assembleRelease -PaltchaAppSecret=<hex64>
# 未注入时该字段为空，APP 无法通过人机验证（登录/评论会提示「人机验证暂不可用」）。
